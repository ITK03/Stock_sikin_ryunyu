# 掲載戦略レジストリ。ページ・バッチはこのファイルだけを見る。
# 追加手順: strategies.pyに関数 → バックテスト → 検証ゲート合格
# (docs/strategy_catalog.md 末尾) → ここに1エントリ追加。
# v3最終ラインナップ（docs/implementation_plan_v2.md「⚠ v3 最終決定」参照）:
#   rsi2_dip（主軸・rsi2_tp_le相当） + keltner_atr_dip（サブ・keltner_tp相当）の2戦略構成。
strategies:
  - id: rsi2_dip
    display_name: "RSI(2)押し目買い（指値+2%利確）"
    enabled: true
    params: {buy_th: 15.0, sell_th: 70.0, trend_n: 200}
    engine: {max_positions: 5, stop_loss: 0.15, max_hold: 10, take_profit: 0.02, limit_entry: 0.01}
    description: "長期上昇トレンド中（終値>SMA200）の短期売られすぎ（RSI(2)<15）を、翌日前日終値−1%の指値で買い、+2%利確を狙う"
    rule_note: "シグナル翌営業日に前日終値−1%で指値買い（当日限り・未約定なら見送り） / 終値が建値+2%以上→翌寄りで利確売り / 未達ならRSI(2)>70で翌寄り売り / 災害ストップ-15% / 最大10営業日 / 等金額・最大5銘柄"
    # rank列の表示方法: 表示値 = rank * sign
    rank_display: {label: "RSI(2)", sign: -1, fmt: "{:.1f}"}
    validated_at: "2026-07-17"
    oos_stats:
      win_rate: 0.660
      profit_factor: 1.21
      max_dd: -0.271
      period: "2022-01〜2026-07"
      trades: 1023
    risks:
      - "検証OOS期間(2022〜2026)は日本株の強い上昇相場で、成績に追い風が含まれる。2018年型のじり安相場では勝率を保っても期待値がマイナスだった実績がある"
      - "最大ドローダウン-25〜-29%は現実に起こり得る（買い専用・少数集中のため急落時は指数並みに沈む）"
      - "災害ストップ-15%は個別銘柄急落時に確実に発動する前提で、失っても生活に影響しない資金で運用すること"
      - "バックテストはyfinance調整済み日足。最終検証は1531銘柄ユニバース（不正データ3銘柄除外後1528銘柄）だが、生存者バイアスを完全には除去できていない"
      - "指値買いのため約定しない日がある（検証上シグナルの約2割が失効）。追いかけて成行で買うと検証と別物になる"
      - "+2%利確は大勝ちを放棄する設計。執行の質（指値・利確の規律）が成績を左右する"

  - id: keltner_atr_dip
    display_name: "ATRチャネル押し目買い（+2%利確）"
    enabled: true
    params: {n: 20, k: 2.5, trend_n: 200}
    engine: {max_positions: 5, stop_loss: 0.15, max_hold: 10, take_profit: 0.02}
    description: "長期上昇トレンド中にSMA(20)−2.5×ATR(20)を下回った深押しを翌寄り成行で買い、+2%で利確"
    rule_note: "翌営業日の寄付で成行買い / 終値が建値+2%以上→翌寄りで利確売り / 未達なら終値≥SMA(20)で翌寄り売り / 災害ストップ-15% / 最大10営業日 / シグナル頻度低め・サブ戦略（5枠中1〜2枠目安）"
    rank_display: {label: "乖離率", sign: 1, fmt: "{:.3f}"}
    validated_at: "2026-07-17"
    oos_stats:
      win_rate: 0.665
      profit_factor: 1.22
      max_dd: -0.339
      period: "2022-01〜2026-07"
      trades: 672
    risks:
      - "検証OOS期間(2022〜2026)は日本株の強い上昇相場で、成績に追い風が含まれる。2018年型のじり安相場では勝率を保っても期待値がマイナスだった実績がある"
      - "最大ドローダウン-25〜-29%は現実に起こり得る（買い専用・少数集中のため急落時は指数並みに沈む）"
      - "災害ストップ-15%は個別銘柄急落時に確実に発動する前提で、失っても生活に影響しない資金で運用すること"
      - "バックテストはyfinance調整済み日足。最終検証は1531銘柄ユニバース（不正データ3銘柄除外後1528銘柄）だが、生存者バイアスを完全には除去できていない"
      - "シグナル頻度が低く（年80回弱）、単独運用では資金が遊びポートフォリオ効率が落ちる。サブ戦略として1〜2枠での運用を推奨"
      - "利確判定は終値ベース→翌寄り売りが検証済みルール。ザラ場指値での利確は未検証"

  - id: rsi2_flow
    display_name: "RSI(2)押し目買い＋資金流入（指値+2%利確）"
    enabled: true
    params: {buy_th: 15.0, sell_th: 70.0, trend_n: 200, surge_th: 1.2}
    engine: {max_positions: 20, stop_loss: 0.15, max_hold: 10, take_profit: 0.02, limit_entry: 0.01}
    description: "rsi2_dipと同じ押し目条件に「売買代金が平常時の1.2倍以上」を課し、薄商いのまま下げた押し目を除いて、出来高を伴って投げが出た押し目だけを買う"
    rule_note: "シグナル翌営業日に前日終値−1%で指値買い（当日限り・未約定なら見送り） / 終値が建値+2%以上→翌寄りで利確売り / 未達ならRSI(2)>70で翌寄り売り / 災害ストップ-15% / 最大10営業日 / 等金額・最大20銘柄（5銘柄集中は手数料負けするため検証で20銘柄に変更）"
    rank_display: {label: "RSI(2)", sign: -1, fmt: "{:.1f}"}
    validated_at: "2026-07-25"
    # 20銘柄分散・片道5bps手数料込みの実運用想定値（research/results/REPORT.md Part D）。
    # 手数料ゼロ・5銘柄集中の見かけ上良い数字ではなく、現実的な条件の値を載せる。
    oos_stats:
      win_rate: 0.638
      profit_factor: 1.10
      max_dd: -0.224
      period: "2022-01〜2026-07"
      trades: 3684
    risks:
      - "1トレード平均は+0.15%(20銘柄・片道5bps)と薄い。片道10bpsまで上がると+0.04%・PF1.03とほぼ優位性が消えるため、手数料の安い口座が事実上の前提になる"
      - "5銘柄集中では片道10bpsで期待値がマイナス(-0.04%・PF0.97)になる。20銘柄程度に分散して初めて手数料に耐える"
      - "最大ドローダウン-22.4%。勝率が高くても資産曲線は荒れる"
      - "20銘柄を1単元ずつ持つには相応の資金が要る(1単元平均30万円なら約600万円)。資金が足りず銘柄数を絞る場合は、手数料への耐性が落ちることを理解した上で運用する"
      - "勝率65%は「+2%利確・-15%損切」の非対称設計によるもの。小さく何度も勝ち、たまに大きく負ける形で、勝率の高さは安全性を意味しない"
      - "rsi2_dipに対する優位性(勝率+4.7pt)はz=2.27と限界的。ただしOOS5年すべてでrsi2_dipを上回った"
      - "生存者バイアスを完全には除去できていない(ユニバースは現在の上場銘柄)"
      - "資金流入フィルタによりシグナル数がrsi2_dipより減る。枠が埋まらない日が増える"
