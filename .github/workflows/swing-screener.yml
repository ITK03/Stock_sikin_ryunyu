name: Swing Screener

# スイングスクリーナー(swing/, Twitter_Master由来のコピー)を実行し、
# public/data/signals.json を生成してmainへコミットする。デプロイ(Build and Deploy)
# は push を [skip ci] で受け流し、次回の定期デプロイで signals.json を Pages へ載せる。
#
# yfinance の日本株データは配信が日により遅いため、Twitter_Master と同様に
# 1日3回実行して当日ぶんの取りこぼしを吸収する(スクリーナーは冪等)。
#   08:00 UTC = 17:00 JST(大引け後)
#   13:00 UTC = 22:00 JST(同日夜の再取得)
#   23:00 UTC = 翌08:00 JST(夜間配信ぶんの回収)
on:
  schedule:
    - cron: "0 8,13,23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: swing-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: swing/requirements.txt
      - name: Install deps
        run: pip install -r swing/requirements.txt
      - name: Unit tests (screener)
        working-directory: swing
        run: python -m pytest tests/test_screener.py -q
      - name: Run screener
        working-directory: swing
        run: python -m screener.run --source fetch --out site
      - name: Publish signals.json / paper_log.json to public/data
        run: |
          set -eu
          test -s swing/site/data/signals.json
          cp swing/site/data/signals.json public/data/signals.json
          # 検証ログ(自動ペーパートレードの pending/open/closed 明細)もフロントへ配信。
          test -s swing/site/data/paper_log.json
          cp swing/site/data/paper_log.json public/data/paper_log.json
      - name: Commit data back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # paper_log は積み上げ式の状態なので毎回コミットして永続化する。
          git add public/data/signals.json public/data/paper_log.json swing/site/data/paper_log.json
          if git diff --cached --quiet; then
            echo "変更なし。スキップ。"
            exit 0
          fi
          git commit -m "swing: シグナル更新(定時実行) [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push retry $i"; sleep $((2 ** i))
          done
          exit 1
