name: Swing Research

# 資金フロー指標(ダッシュボードのランキング指標)の予測力検証を実データで走らせる。
# サンドボックスからは市場データに到達できないため、ネットワークのある Actions 上で
# 実行し、生成されたレポート(REPORT.md / report.json)だけをコミットして持ち帰る。
#
# 研究コード(swing/research/**)を push したときに自動実行する。生成物である
# swing/research/results/** は paths-ignore で除外してあるため、レポートの
# コミットが再実行を呼ぶ無限ループにはならない。

on:
  workflow_dispatch:
    inputs:
      source:
        description: "価格データの取得元 (full=parquetキャッシュを再取得 / cache=csv.gz)"
        default: "full"
  push:
    branches: [claude/aggregate-software-models-kay9da, main]
    paths:
      - "swing/research/**"
      - ".github/workflows/swing-research.yml"
      - "!swing/research/results/**"

permissions:
  contents: write

concurrency:
  group: swing-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: swing/requirements.txt
      - name: Install deps
        run: pip install -r swing/requirements.txt pyarrow

      - name: Unit tests (指標がダッシュボード定義と一致することの確認)
        working-directory: swing
        run: python -m pytest tests/test_flow.py tests/test_indicators.py -q

      # 価格データは重い(約1,500銘柄×11年)。同日中の再実行では再取得しない。
      - name: Cache price data
        id: cache-prices
        uses: actions/cache@v4
        with:
          path: swing/data/full
          key: swing-full-prices-${{ github.run_id }}
          restore-keys: swing-full-prices-

      - name: Fetch full price history (2015〜, JPXプライム全銘柄)
        working-directory: swing
        run: |
          set -eu
          # キャッシュヒット時も当年分だけは更新する(--backfillなしは当年のみ再取得)。
          if [ -d data/full ] && [ -n "$(ls -A data/full 2>/dev/null)" ]; then
            echo "キャッシュあり: 当年分のみ更新"
            python -m backtest.data_full --chunk 40 --sleep 2.0
          else
            echo "キャッシュなし: 全期間バックフィル"
            python -m backtest.data_full --backfill --chunk 40 --sleep 2.0
          fi
          ls -la data/full

      - name: Run study
        working-directory: swing
        run: python -m research.study --source "${{ github.event.inputs.source || 'full' }}"

      - name: Commit report
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f swing/research/results/REPORT.md swing/research/results/report.json
          if git diff --cached --quiet; then
            echo "レポートに変更なし"
            exit 0
          fi
          git commit -m "research: 資金フロー指標の検証レポートを更新 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && break
            sleep $((2 ** i))
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-research-report
          path: swing/research/results/
          retention-days: 30
